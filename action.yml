# codex-guard — quality gate for AI/Codex-generated pull requests.
# Marketplace display name must stay unique (GitHub normalizes spaces, so
# "Codex Guard PR Quality Gate" avoids colliding with existing listings).
# See README.md for the full input reference and examples.
name: 'Codex Guard PR Quality Gate'
description: >-
  Quality gate for AI-generated pull requests: blocks TODO leftovers, leaked
  secrets, sloppy commits and red CI.
author: 'akimiya'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  preset:
    description: >
      Optional policy baseline: observe reports without blocking, balanced
      blocks secrets/commits/CI while warning on TODOs, and strict blocks every
      default check. Empty preserves legacy input behavior. Repo config wins.
    required: false
    default: ''
  github-token:
    description: >
      Token with write access to the repository. Used to read PR files/commits
      and report the result as a check run plus (optionally) a PR comment.
    required: false
    default: ${{ github.token }}
  config-path:
    description: >
      Optional per-repo policy file (default branch) whose keys override the
      workflow inputs. Omit or leave empty to skip. See README "Configuration".
    required: false
    default: .github/codex-guard.yml
  fail-on:
    description: >
      Comma-separated checks that count as blocking: todos,secrets,commits,ci.
      Default (empty) keeps legacy behavior (todos governed by todo-blocking,
      others always blocking). Selecting a subset makes the rest non-blocking.
    required: false
    default: ''
  sweep:
    description: >
      Scan every open PR instead of a single one (use with workflow_dispatch).
      Detects agent PRs, runs the checks against each, and writes one sweep
      report to the run summary + outputs. No per-PR comments or check-runs.
    required: false
    default: 'false'
  sweep-label:
    description: 'Only sweep PRs carrying this label (empty = all detected agent PRs).'
    required: false
    default: ''
  sweep-base:
    description: 'Only sweep PRs targeting this base branch.'
    required: false
    default: 'main'

  # ---- Agent detection ----------------------------------------------------
  gate-agents-only:
    description: >
      Only gate PRs that look like they were generated by an AI coding agent
      (labeled "codex-generated", branches under codex/, or a matching title).
      Set to 'false' to gate every PR.
    required: false
    default: 'true'
  agent-labels:
    description: 'Comma-separated PR labels that mark a PR as agent-generated.'
    required: false
    default: 'codex-generated,agentic,ai-generated'
  agent-branch-prefixes:
    description: 'Comma-separated head-branch prefixes that mark a PR as agent-generated.'
    required: false
    default: 'codex/,copilot/,claude-auto,gh-codex/'
  agent-keywords:
    description: 'Comma-separated title keywords that mark a PR as agent-generated.'
    required: false
    default: 'Generated by Codex,Generated by Claude,Generated by Copilot'
  ignore-label:
    description: >
      PR label that skips all checks (for PRs a human already reviewed and
      accepted).
    required: false
    default: 'codex-guard-ignore'

  # ---- TODO check ---------------------------------------------------------
  check-todos:
    description: 'Scan added lines for leftover TODO/FIXME/XXX markers.'
    required: false
    default: 'true'
  todo-patterns:
    description: 'Comma-separated markers to flag as unfinished work.'
    required: false
    default: 'TODO,FIXME,XXX,HACK,WIP'
  todo-blocking:
    description: >
      Treat TODO findings as a failure ('true') or only as a warning that does
      not fail the check ('false').
    required: false
    default: 'true'

  # ---- Secret check -------------------------------------------------------
  check-secrets:
    description: 'Scan added lines for common hardcoded secrets and credentials.'
    required: false
    default: 'true'
  secret-exclude-paths:
    description: >
      Comma-separated file path substrings to skip during the secret scan
      (e.g. test fixtures or docs that contain example credentials).
    required: false
    default: ''

  # ---- Commit check -------------------------------------------------------
  check-commits:
    description: 'Verify commit subjects follow the configured pattern.'
    required: false
    default: 'true'
  commit-pattern:
    description: 'Regular expression a commit subject must match.'
    required: false
    default: '(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9-]+\\))?!?: .+|Merge .*|Revert .*|Initial commit|Update .+|Bump .+'

  # ---- CI check -----------------------------------------------------------
  check-ci:
    description: >
      Fail when the head branch has failing status checks or failing check runs
      (CI results on the PR commit).
    required: false
    default: 'true'
  ignore-check-run-names:
    description: >
      Comma-separated check-run / status-context names to ignore when reading
      CI results. Add this action's own check name here if it ever reports a
      stale failure in your setup.
    required: false
    default: ''

  # ---- Reporting ----------------------------------------------------------
  post-comment:
    description: 'Post a summary comment on failures (deduplicated).'
    required: false
    default: 'true'
  comment-mode:
    description: >
      How to handle the report comment on repeat runs: 'replace' updates the
      previous Codex Guard comment in place (one living report per PR),
      'append' posts a new comment each run, 'none' never posts.
    required: false
    default: 'replace'
  request-changes:
    description: >
      When findings are blocking, also submit a formal REQUEST_CHANGES review on
      the PR (opt-in; requires the pull-requests: write permission).
    required: false
    default: 'false'
  notify-users:
    description: >
      Comma-separated GitHub usernames to @-mention in the report comment when
      findings are blocking (e.g. the human owner of the PR).
    required: false
    default: ''
  soft-fail:
    description: >
      Report findings but never fail the workflow. Useful when you want to
      observe before enforcing.
    required: false
    default: 'false'

outputs:
  policy-preset:
    description: 'Selected policy baseline: observe, balanced, strict, or custom.'
  result:
    description: "'pass' or 'fail' depending on the gated checks."
  detected-agent:
    description: "'true' if the PR was detected as agent-generated."
  failed-checks:
    description: 'Comma-separated names of the checks that failed.'
  todo-count:
    description: 'Number of TODO-style findings reported.'
  secret-count:
    description: 'Number of secret findings reported.'
  commit-count:
    description: 'Number of non-conforming commit findings reported.'
  ci-failure-count:
    description: 'Number of failing CI checks reported.'
  content-scan-coverage:
    description: >
      Text patches scanned / eligible changed files, for example '12/13', or
      'disabled' when TODO and secret checks are both off.
  unscanned-file-count:
    description: >
      Eligible files not content-scanned because GitHub omitted the text
      patch.
  findings-json:
    description: >
      JSON string of the full run report (todos, secrets, commits, ci,
      coverage) for
      downstream steps — gate more, build dashboards, or post elsewhere.
  sweep-scanned:
    description: 'Sweep mode: number of agent-generated PRs inspected.'
  sweep-failed:
    description: 'Sweep mode: number of inspected PRs with blocking findings.'
  sweep-report:
    description: 'Sweep mode: the markdown report (also written to the run summary).'
  sweep-json:
    description: 'Sweep mode: per-PR JSON summary of findings.'

runs:
  using: 'node24'
  main: 'dist/index.js'
