# Gate every PR, and don't treat docs as a secret source
name: Codex Guard
on:
  pull_request:

permissions:
  contents: read
  statuses: read
  pull-requests: write
  checks: write

jobs:
  codex-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: Akimiya-z/codex-guard@v1
        with:
          preset: 'strict'
          gate-agents-only: 'false'
          secret-exclude-paths: 'README.md,docs/'
