# Retro-sweep: inspect every open agent-generated PR in one run.
# Trigger manually: Actions → Codex Guard Sweep → Run workflow.
# No per-PR comments/check-runs are posted; the report lands in the run
# summary and in the `sweep-report` output.
name: Codex Guard Sweep
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  checks: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: Akimiya-z/codex-guard@v1
        with:
          sweep: 'true'
          # Optional filters:
          # sweep-base: main
          # sweep-label: needs-attention
