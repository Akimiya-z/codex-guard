# Example per-repo policy — put this at the default branch as
# `.github/codex-guard.yml`. Any key documented in the README input table can
# be overridden here; unknown keys are ignored.

preset: balanced
gate-agents-only: true

agent-labels:
  - codex-generated
  - agentic
  - ai-generated

agent-branch-prefixes:
  - codex/
  - copilot/
  - claude-auto/
  - gh-codex/

agent-keywords:
  - Generated by Codex
  - Generated by Claude
  - Generated by Copilot

todo-patterns:
  - TODO
  - FIXME
  - XXX
  - HACK
  - WIP

secret-exclude-paths:
  - README.md
  - docs/
  - test/fixtures/

comment-mode: replace
request-changes: true
