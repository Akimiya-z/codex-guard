name: Codex Guard
on:
  pull_request:

permissions:
  contents: read
  statuses: read
  pull-requests: write
  checks: write

jobs:
  codex-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: Akimiya-z/codex-guard@v1
        with:
          # Gate only PRs that look AI-generated; human PRs pass untouched.
          gate-agents-only: 'true'
          # Dogfood both quality gates: one living report per PR + a formal
          # REQUEST_CHANGES review on blocking findings.
          request-changes: 'true'
