# Dogfood: retro-sweep of open agent PRs (v1.6.0).
name: Codex Guard Sweep
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  checks: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: Akimiya-z/codex-guard@v1
        id: guard
        with:
          sweep: 'true'
      - name: Show sweep report
        env:
          SWEEP_REPORT: ${{ steps.guard.outputs.sweep-report }}
        run: |
          echo "scanned: ${{ steps.guard.outputs.sweep-scanned }}"
          echo "failed: ${{ steps.guard.outputs.sweep-failed }}"
          printf '%s\n' "$SWEEP_REPORT"
