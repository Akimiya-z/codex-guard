name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Codex Guard's job is babysitting agent PRs — its own keep it honest.
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  validate-action:
    name: validate action.yml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: parse action.yml
        run: |
          set +e
          npx --yes @action-validator/cli action.yml > /tmp/val.out 2>&1
          code=$?
          [ $code -eq 0 ] && exit 0
          # action-validator lags behind GitHub's runtimes (it rejects the
          # current node24 runtime). Only tolerate that specific gap.
          if grep -q 'node24' /tmp/val.out; then
            echo "::warning::action-validator is outdated for node24; structural checks skipped"
            exit 0
          fi
          cat /tmp/val.out
          exit 1
