name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Codex Guard's job is babysitting agent PRs — its own keep it honest.
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  validate-action:
    name: validate YAML manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: parse action.yml
        run: |
          set +e
          npx --yes @action-validator/cli action.yml > /tmp/val.out 2>&1
          code=$?
          [ $code -eq 0 ] && exit 0
          # action-validator lags behind GitHub's current runtimes and rejects
          # the node24 `runs.using` value that GitHub now supports. Tolerate
          # only that specific enum error; everything else still fails.
          if grep -q '/runs/using' /tmp/val.out && grep -q 'Enum conditions are not met' /tmp/val.out; then
            echo "::warning::action-validator is outdated for node24; structural checks skipped"
            exit 0
          fi
          cat /tmp/val.out
          exit 1
      - name: parse workflow files
        run: |
          for f in .github/workflows/*.yml; do
            npx --yes @action-validator/cli "$f" > /tmp/wf.out 2>&1 || {
              cat /tmp/wf.out
              exit 1
            }
          done
          echo "all workflows OK"

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --experimental-test-coverage 2>&1 | tail -20